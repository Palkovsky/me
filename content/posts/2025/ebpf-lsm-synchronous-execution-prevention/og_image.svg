<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">eBPF and LSM synchronous execution prevention</title>
  <desc id="desc">An editorial diagram showing an execution request passing through an LSM hook and eBPF policy before the kernel returns EPERM.</desc>

  <defs>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aa4d2b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315e73"/>
    </marker>
  </defs>

  <!-- Technical Journal paper field -->
  <rect width="1200" height="630" fill="#fffdf8"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#d9cdbb"/>
  <rect x="28" y="28" width="8" height="574" fill="#aa4d2b"/>

  <!-- Editorial header -->
  <text x="78" y="70" fill="#aa4d2b" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1.6">2025</text>
  <line x1="78" y1="89" x2="1122" y2="89" stroke="#d9cdbb"/>

  <text x="78" y="153" fill="#29231f" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="58" font-weight="700">eBPF + LSM</text>
  <text x="78" y="196" fill="#5d5148" font-family="Avenir Next, Avenir, 'Segoe UI', sans-serif" font-size="27" letter-spacing="0.2">Synchronous execution prevention</text>

  <!-- Flow labels -->
  <text x="78" y="263" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="1.2">01  EXECUTION REQUEST</text>
  <text x="452" y="263" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="1.2">02  KERNEL DECISION</text>
  <text x="904" y="263" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="1.2">03  OUTCOME</text>

  <!-- Request -->
  <rect x="78" y="306" width="288" height="146" fill="#faf3e3" stroke="#b7a895"/>
  <rect x="78" y="306" width="288" height="5" fill="#315e73"/>
  <text x="96" y="350" fill="#29231f" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="25" font-weight="700">Process calls execve</text>
  <line x1="96" y1="370" x2="348" y2="370" stroke="#d9cdbb"/>
  <text x="96" y="403" fill="#315e73" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="16">execve(path, argv, envp)</text>
  <text x="96" y="429" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">path = /usr/bin/netcat</text>

  <!-- Request to policy -->
  <line x1="382" y1="379" x2="430" y2="379" stroke="#315e73" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- LSM and eBPF decision -->
  <rect x="448" y="282" width="376" height="194" fill="#fffdf8" stroke="#aa4d2b" stroke-width="2"/>
  <rect x="448" y="282" width="376" height="42" fill="#aa4d2b"/>
  <text x="468" y="309" fill="#fffdf8" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="700">LSM  bprm_check_security</text>

  <text x="470" y="359" fill="#29231f" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="23" font-weight="700">eBPF policy</text>
  <text x="470" y="389" fill="#5d5148" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="15">hash(path)  →  map lookup</text>
  <line x1="470" y1="408" x2="802" y2="408" stroke="#d9cdbb"/>
  <circle cx="482" cy="439" r="5" fill="#aa4d2b"/>
  <text x="500" y="445" fill="#7e351f" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="700">blacklisted = true</text>
  <text x="802" y="445" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" text-anchor="end">synchronous</text>

  <!-- Policy to outcome -->
  <line x1="842" y1="379" x2="890" y2="379" stroke="#aa4d2b" stroke-width="2" marker-end="url(#arrow-rust)"/>

  <!-- Denied outcome -->
  <rect x="904" y="282" width="218" height="194" fill="#f1e5ce" stroke="#aa4d2b" stroke-width="2"/>
  <text x="1013" y="343" fill="#7e351f" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="42" font-weight="700" text-anchor="middle">-EPERM</text>
  <line x1="930" y1="363" x2="1096" y2="363" stroke="#b7a895"/>
  <text x="1013" y="401" fill="#29231f" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="20" font-weight="700" text-anchor="middle">Execution denied</text>
  <text x="1013" y="431" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" text-anchor="middle">before the binary runs</text>

  <!-- Footer note -->
  <line x1="78" y1="522" x2="1122" y2="522" stroke="#d9cdbb"/>
  <text x="78" y="557" fill="#5d5148" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="18">Kernel-level policy enforcement with Linux Security Modules</text>
  <text x="1122" y="557" fill="#315e73" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" text-anchor="end">dawidmacek.com</text>
</svg>
