<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Escaping the OS-provided stack</title>
  <desc id="desc">An editorial diagram showing a constrained operating-system stack, a stack-pointer swap, and a larger caller-owned auxiliary stack.</desc>

  <defs>
    <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aa4d2b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315e73"/>
    </marker>
  </defs>

  <!-- Technical Journal paper field -->
  <rect width="1200" height="630" fill="#fffdf8"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#d9cdbb"/>
  <rect x="28" y="28" width="8" height="574" fill="#aa4d2b"/>

  <!-- Editorial header -->
  <text x="78" y="70" fill="#aa4d2b" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1.6">2025</text>
  <line x1="78" y1="89" x2="1122" y2="89" stroke="#d9cdbb"/>

  <text x="78" y="153" fill="#29231f" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="52" font-weight="700">Escaping the OS-provided stack</text>
  <text x="78" y="196" fill="#5d5148" font-family="Avenir Next, Avenir, 'Segoe UI', sans-serif" font-size="27" letter-spacing="0.2">Moving stack-heavy work onto caller-owned memory</text>

  <!-- Flow labels -->
  <text x="78" y="263" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="1.2">01  CONSTRAINED STACK</text>
  <text x="448" y="263" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="1.2">02  POINTER SWAP</text>
  <text x="832" y="263" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="1.2">03  AUXILIARY STACK</text>

  <!-- OS-provided stack -->
  <rect x="78" y="282" width="288" height="194" fill="#faf3e3" stroke="#b7a895"/>
  <rect x="78" y="282" width="288" height="5" fill="#315e73"/>
  <text x="96" y="321" fill="#29231f" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="22" font-weight="700">OS-provided stack</text>
  <line x1="96" y1="338" x2="348" y2="338" stroke="#d9cdbb"/>

  <text x="96" y="380" fill="#7e351f" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="36" font-weight="700">16 KB</text>
  <text x="220" y="363" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">fixed OS limit</text>
  <text x="220" y="383" fill="#7e351f" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700">constrained</text>
  <line x1="96" y1="396" x2="348" y2="396" stroke="#d9cdbb"/>

  <rect x="96" y="406" width="252" height="16" fill="#f1e5ce"/>
  <text x="108" y="418" fill="#5d5148" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="11">main()</text>
  <rect x="96" y="425" width="252" height="16" fill="#f1e5ce"/>
  <text x="108" y="437" fill="#5d5148" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="11">init()</text>
  <rect x="96" y="444" width="252" height="16" fill="#f1e5ce"/>
  <text x="108" y="456" fill="#315e73" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700">switch_stack()</text>
  <line x1="96" y1="466" x2="348" y2="466" stroke="#aa4d2b" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- OS stack to pointer swap -->
  <line x1="382" y1="379" x2="430" y2="379" stroke="#315e73" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Stack-pointer operation -->
  <rect x="448" y="282" width="300" height="194" fill="#fffdf8" stroke="#aa4d2b" stroke-width="2"/>
  <rect x="448" y="282" width="300" height="42" fill="#aa4d2b"/>
  <text x="468" y="309" fill="#fffdf8" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="700">switch_stack(callback)</text>
  <text x="598" y="371" fill="#7e351f" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="28" font-weight="700" text-anchor="middle">rsp ← aux_top</text>
  <line x1="470" y1="394" x2="726" y2="394" stroke="#d9cdbb"/>
  <text x="470" y="424" fill="#5d5148" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13">call callback on new stack</text>
  <text x="470" y="451" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13">restore rsp when it returns</text>

  <!-- Pointer swap to auxiliary stack -->
  <line x1="766" y1="379" x2="814" y2="379" stroke="#aa4d2b" stroke-width="2" marker-end="url(#arrow-rust)"/>

  <!-- Auxiliary stack -->
  <rect x="832" y="282" width="290" height="194" fill="#faf3e3" stroke="#63715e" stroke-width="2"/>
  <rect x="832" y="282" width="290" height="5" fill="#63715e"/>
  <text x="850" y="321" fill="#29231f" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="22" font-weight="700">Auxiliary stack</text>
  <line x1="850" y1="338" x2="1104" y2="338" stroke="#d9cdbb"/>

  <text x="850" y="380" fill="#63715e" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="36" font-weight="700">1 MB</text>
  <text x="966" y="363" fill="#807167" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">caller-owned</text>
  <text x="966" y="383" fill="#63715e" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="700">64× larger</text>
  <line x1="850" y1="396" x2="1104" y2="396" stroke="#d9cdbb"/>

  <rect x="850" y="411" width="254" height="22" fill="#edf0e9"/>
  <text x="862" y="426" fill="#5d5148" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="11">heavy_work()</text>
  <rect x="850" y="438" width="254" height="22" fill="#edf0e9"/>
  <text x="862" y="453" fill="#5d5148" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="11">deep_recursion()</text>
  <line x1="850" y1="466" x2="1104" y2="466" stroke="#63715e" stroke-width="2"/>

  <!-- Footer note -->
  <line x1="78" y1="522" x2="1122" y2="522" stroke="#d9cdbb"/>
  <text x="78" y="557" fill="#5d5148" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="18">Running complex code outside a constrained kernel stack</text>
  <text x="1122" y="557" fill="#315e73" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" text-anchor="end">dawidmacek.com</text>
</svg>
