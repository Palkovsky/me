<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Escaping the OS-provided stack</title>
  <desc id="desc">A constrained operating-system stack, a stack-pointer swap, and a larger caller-owned auxiliary stack, drawn as three code panels in the site's web-safe style.</desc>

  <!-- Steel ground and the table's outer bevel -->
  <rect width="1200" height="630" fill="#336699"/>
  <path fill="#6699cc" d="M24 24H1176l-4 4H28V602l-4 4Z"/><path fill="#000033" d="M1176 24V606H24l4 -4H1172V28Z"/>
  <rect x="28" y="28" width="1144" height="574" fill="#ffffff"/>

  <!-- Banner row: the name embossed in gold, the tagline in sky -->
  <rect x="28" y="28" width="1144" height="88" fill="#000033"/>
  <rect x="28" y="116" width="1144" height="6" fill="#ffcc00"/>
  <text x="78" y="76" fill="#ffff99" font-family="Georgia, Gelasio, serif" font-size="44" font-weight="700" letter-spacing="0.44">Dawid Macek</text><text x="82" y="80" fill="#996600" font-family="Georgia, Gelasio, serif" font-size="44" font-weight="700" letter-spacing="0.44">Dawid Macek</text><text x="80" y="78" fill="#ffcc00" font-family="Georgia, Gelasio, serif" font-size="44" font-weight="700" letter-spacing="0.44">Dawid Macek</text>
  <text x="80" y="102" fill="#99ccff" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="4.2">SYSTEMS PROGRAMMING</text>

  <!-- Footer row -->
  <rect x="28" y="550" width="1144" height="6" fill="#ffcc00"/>
  <rect x="28" y="556" width="1144" height="46" fill="#000033"/>
  <text x="80" y="585" fill="#99ccff" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16">Running complex code outside a constrained kernel stack</text>
  <text x="1120" y="585" fill="#ffcc00" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="end">dawidmacek.com</text>

  <!-- Article header: title, dek, meta -->
  <text x="80" y="190" fill="#000033" font-family="Georgia, Gelasio, serif" font-size="52" font-weight="700">Escaping the OS-provided stack</text>
  <text x="80" y="230" fill="#333333" font-family="Georgia, Gelasio, serif" font-size="26" font-style="italic">Moving stack-heavy work onto caller-owned memory</text>
  <text x="80" y="262" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="15"><tspan fill="#666666">Published </tspan><tspan fill="#000000" font-weight="700">November 10, 2025</tspan></text>
  <rect x="80" y="280" width="1040" height="2" fill="#999999"/><rect x="80" y="282" width="1040" height="2" fill="#cccccc"/>

  <!-- Constrained stack -->
  <rect x="80" y="304" width="304" height="224" fill="#cccccc"/><path fill="#ffffff" d="M80 304H384l-3 3H83V525l-3 3Z"/><path fill="#666666" d="M384 304V528H80l3 -3H381V307Z"/><text x="95" y="332" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.84">CONSTRAINED STACK</text><rect x="87" y="347" width="290" height="174" fill="#ffffff"/><path fill="#666666" d="M87 347H377l-2 2H89V519l-2 2Z"/><path fill="#ffffff" d="M377 347V521H87l2 -2H375V349Z"/>
  <text x="103" y="383" fill="#003366" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="19" font-weight="700">OS-provided stack</text>
  <text x="103" y="429" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="34" xml:space="preserve"><tspan fill="#000000">16 KB</tspan></text>
  <text x="239" y="411" fill="#666666" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="12">fixed OS limit</text>
  <text x="239" y="429" fill="#333333" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700">constrained</text>
  <text x="103" y="463" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#000000">main()</tspan></text>
  <text x="103" y="482" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#000000">init()</tspan></text>
  <rect x="89" y="487" width="286" height="19" fill="#ffff99"/>
  <text x="103" y="501" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#000000">switch_stack()</tspan></text>

  <!-- Pointer swap -->
  <rect x="440" y="304" width="316" height="224" fill="#cccccc"/><path fill="#ffffff" d="M440 304H756l-3 3H443V525l-3 3Z"/><path fill="#666666" d="M756 304V528H440l3 -3H753V307Z"/><text x="455" y="332" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.84">POINTER SWAP</text><rect x="447" y="347" width="302" height="174" fill="#ffffff"/><path fill="#666666" d="M447 347H749l-2 2H449V519l-2 2Z"/><path fill="#ffffff" d="M749 347V521H447l2 -2H747V349Z"/>
  <text x="463" y="381" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="16" xml:space="preserve"><tspan fill="#000000">switch_stack(callback)</tspan></text>
  <rect x="449" y="401" width="298" height="50" fill="#ffff99"/>
  <text x="598.0" y="436" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="28" xml:space="preserve" text-anchor="middle"><tspan fill="#000000">rsp ← aux_top</tspan></text>
  <text x="463" y="477" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#000000">call callback on new stack</tspan></text>
  <text x="463" y="499" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#666666">restore rsp when it returns</tspan></text>

  <!-- Auxiliary stack -->
  <rect x="812" y="304" width="308" height="224" fill="#cccccc"/><path fill="#ffffff" d="M812 304H1120l-3 3H815V525l-3 3Z"/><path fill="#666666" d="M1120 304V528H812l3 -3H1117V307Z"/><text x="827" y="332" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.84">AUXILIARY STACK</text><rect x="819" y="347" width="294" height="174" fill="#ffffff"/><path fill="#666666" d="M819 347H1113l-2 2H821V519l-2 2Z"/><path fill="#ffffff" d="M1113 347V521H819l2 -2H1111V349Z"/>
  <text x="835" y="383" fill="#003366" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="19" font-weight="700">Auxiliary stack</text>
  <text x="835" y="429" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="34" xml:space="preserve"><tspan fill="#000000">1 MB</tspan></text>
  <text x="971" y="411" fill="#666666" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="12">caller-owned</text>
  <text x="971" y="429" fill="#333333" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700">64× larger</text>
  <text x="835" y="463" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#000000">heavy_work()</tspan></text>
  <text x="835" y="482" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve"><tspan fill="#000000">deep_recursion()</tspan></text>

  <!-- Flow -->
  <rect x="394" y="432.5" width="21" height="3" fill="#003366"/><polygon points="430,434 414,425 414,443" fill="#003366"/><rect x="766" y="432.5" width="21" height="3" fill="#003366"/><polygon points="802,434 786,425 786,443" fill="#003366"/>
</svg>
