<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" width="800" height="344" role="img" aria-labelledby="title desc">
  <title id="title">eBPF policy enforcement with Rust, kfuncs, and regexes</title>
  <desc id="desc">An architecture diagram with a user process above an eBPF probe, a C kernel module, and a Rust regex library in kernel space.</desc>

  <rect width="800" height="344" fill="#ffffff"/>
  <!-- User space -->
  <rect x="2" y="2" width="796" height="94" fill="#cccccc"/><path fill="#ffffff" d="M2 2H798l-3 3H5V93l-3 3Z"/><path fill="#666666" d="M798 2V96H2l3 -3H795V5Z"/>
  <text x="17" y="25" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.84">USER SPACE</text>
  <rect x="254" y="35" width="292" height="44" fill="#ffffff"/><path fill="#666666" d="M254 35H546l-2 2H256V77l-2 2Z"/><path fill="#ffffff" d="M546 35V79H254l2 -2H544V37Z"/>
  <text x="400.0" y="62.4" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="15" text-anchor="middle">User Process (e.g. bash)</text>
  <!-- Kernel space -->
  <rect x="2" y="136" width="796" height="206" fill="#cccccc"/><path fill="#ffffff" d="M2 136H798l-3 3H5V339l-3 3Z"/><path fill="#666666" d="M798 136V342H2l3 -3H795V139Z"/>
  <text x="783" y="159" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.84" text-anchor="end">KERNEL SPACE</text>
  <!-- eBPF AMSI -->
  <rect x="19" y="169" width="198" height="156" fill="#ffffff"/><path fill="#666666" d="M19 169H217l-2 2H21V323l-2 2Z"/><path fill="#ffffff" d="M217 169V325H19l2 -2H215V171Z"/>
  <text x="118.0" y="195" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle">eBPF AMSI</text>
  <text x="118.0" y="216" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve" text-anchor="middle"><tspan fill="#003366">LSM Probe / kprobe</tspan></text>
  <rect x="31" y="227" width="174" height="2" fill="#999999"/><rect x="31" y="229" width="174" height="2" fill="#cccccc"/>
  <rect x="33" y="249.32" width="6" height="6" fill="#003366"/>
  <text x="47" y="257" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="13" xml:space="preserve"><tspan font-family="Verdana, 'DejaVu Sans', sans-serif">Collects cmdline</tspan></text>
  <rect x="33" y="271.32" width="6" height="6" fill="#003366"/>
  <text x="47" y="279" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="13" xml:space="preserve"><tspan font-family="Verdana, 'DejaVu Sans', sans-serif">Calls </tspan><tspan font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="12">kfunc</tspan></text>
  <rect x="33" y="293.32" width="6" height="6" fill="#003366"/>
  <text x="47" y="301" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="13" xml:space="preserve"><tspan font-family="Verdana, 'DejaVu Sans', sans-serif">Enforces decision</tspan></text>
  <!-- Kernel Module (C) -->
  <rect x="301" y="169" width="198" height="156" fill="#ffffff"/><path fill="#666666" d="M301 169H499l-2 2H303V323l-2 2Z"/><path fill="#ffffff" d="M499 169V325H301l2 -2H497V171Z"/>
  <text x="400.0" y="195" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Kernel Module (C)</text>
  <text x="400.0" y="216" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve" text-anchor="middle"><tspan fill="#003366">(regex_set.ko)</tspan></text>
  <rect x="313" y="227" width="174" height="2" fill="#999999"/><rect x="313" y="229" width="174" height="2" fill="#cccccc"/>
  <rect x="315" y="249.32" width="6" height="6" fill="#003366"/>
  <text x="329" y="257" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="13" xml:space="preserve"><tspan font-family="Verdana, 'DejaVu Sans', sans-serif">Registers </tspan><tspan font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="12">kfunc</tspan></text>
  <rect x="315" y="271.32" width="6" height="6" fill="#003366"/>
  <text x="329" y="279" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="13" xml:space="preserve"><tspan font-family="Verdana, 'DejaVu Sans', sans-serif">Allocator (</tspan><tspan font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="12">kmalloc</tspan><tspan font-family="Verdana, 'DejaVu Sans', sans-serif">)</tspan></text>
  <!-- Rust Regex Library -->
  <rect x="583" y="169" width="198" height="156" fill="#ffffff"/><path fill="#666666" d="M583 169H781l-2 2H585V323l-2 2Z"/><path fill="#ffffff" d="M781 169V325H583l2 -2H779V171Z"/>
  <text x="682.0" y="195" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Rust Regex Library</text>
  <text x="682.0" y="216" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" xml:space="preserve" text-anchor="middle"><tspan fill="#003366">(libregex_c.a)</tspan></text>
  <rect x="595" y="227" width="174" height="2" fill="#999999"/><rect x="595" y="229" width="174" height="2" fill="#cccccc"/>
  <rect x="597" y="249.32" width="6" height="6" fill="#003366"/>
  <text x="611" y="257" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="13" xml:space="preserve"><tspan font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="12">RegexSet</tspan><tspan font-family="Verdana, 'DejaVu Sans', sans-serif"> (</tspan><tspan font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="12">no_std</tspan><tspan font-family="Verdana, 'DejaVu Sans', sans-serif">)</tspan></text>
  <rect x="597" y="271.32" width="6" height="6" fill="#003366"/>
  <text x="611" y="279" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="13" xml:space="preserve"><tspan font-family="Verdana, 'DejaVu Sans', sans-serif">FFI / C API</tspan></text>
  <rect x="597" y="293.32" width="6" height="6" fill="#003366"/>
  <text x="611" y="301" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="13" xml:space="preserve"><tspan font-family="Verdana, 'DejaVu Sans', sans-serif">SIMD enabled</tspan></text>
  <text x="259.0" y="217" fill="#003366" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="13" text-anchor="middle">kfunc</text>
  <rect x="227" y="225.5" width="53" height="3" fill="#003366"/><polygon points="291,227 279,220 279,234" fill="#003366"/>
  <rect x="238" y="257.5" width="53" height="3" fill="#003366"/><polygon points="227,259 239,252 239,266" fill="#003366"/>
  <text x="541.0" y="217" fill="#003366" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="13" text-anchor="middle">calls</text>
  <rect x="509" y="225.5" width="53" height="3" fill="#003366"/><polygon points="573,227 561,220 561,234" fill="#003366"/>
  <rect x="520" y="257.5" width="53" height="3" fill="#003366"/><polygon points="509,259 521,252 521,266" fill="#003366"/>
