<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">eBPF policy enforcement with Rust, kfuncs, and regexes</title>
  <desc id="desc">An architecture diagram with a user process above an eBPF probe, a C kernel module, and a Rust regex library in kernel space.</desc>

  <rect width="800" height="400" fill="#fffdf8"/>

  <g>
  <!-- User Space -->
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf3e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#faf3e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fffdf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ebpfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf3e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#faf3e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf3e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#faf3e3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- User Space Container -->
  <rect x="50" y="30" width="700" height="100" fill="url(#userGrad)" stroke="#315e73" stroke-width="2" rx="2"/>
  <text x="70" y="55" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="bold" fill="#315e73">USER SPACE</text>
  
  <!-- User Process Box -->
  <rect x="275" y="55" width="250" height="50" fill="#fffdf8" stroke="#315e73" stroke-width="2" rx="2"/>
  <text x="400" y="85" font-family="Avenir Next, Avenir, 'Segoe UI', sans-serif" font-size="14" fill="#29231f" text-anchor="middle">User Process (e.g. bash)</text>
  
  <!-- Kernel Space Container -->
  <rect x="50" y="180" width="700" height="200" fill="url(#kernelGrad)" stroke="#aa4d2b" stroke-width="2" rx="2"/>
  <text x="640" y="205" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="bold" fill="#aa4d2b">KERNEL SPACE</text>

  <!-- S-shaped Arrow from User Process to eBPF -->
  <path d="M 400 115 L 400 145 Q 400 155, 390 155 L 160 155 Q 150 155, 150 165 L 150 215" 
        fill="none" stroke="#315e73" stroke-width="2"/>
  <polygon points="400,110 395,120 405,120" fill="#315e73"/>
  <polygon points="150,220 145,210 155,210" fill="#315e73"/>
  <text x="270" y="150" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#315e73"> </text>
  
  <!-- eBPF Program Box -->
  <rect x="70" y="225" width="180" height="130" fill="url(#ebpfGrad)" stroke="#315e73" stroke-width="2" rx="2"/>
  <text x="160" y="245" font-family="Avenir Next, Avenir, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#29231f" text-anchor="middle">eBPF AMSI</text>
  <text x="160" y="265" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#315e73" text-anchor="middle">LSM Probe / kprobe</text>
  <line x1="80" y1="275" x2="240" y2="275" stroke="#d9cdbb" stroke-width="1"/>
  <text x="85" y="295" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5d5148">• Collects cmdline</text>
  <text x="85" y="315" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5d5148">• Calls kfunc</text>
  <text x="85" y="335" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#315e73">• Enforces decision</text>
  
  <!-- Arrow between eBPF and Kernel Module -->
  <text x="275" y="260" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#315e73" text-anchor="middle">kfunc</text>
  <path d="M 260 270 L 300 270" stroke="#315e73" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 300 300 L 260 300" stroke="#aa4d2b" stroke-width="2" marker-end="url(#arrowOrange)"/>
  
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M2,0 L2,6 L11,3 z" fill="#315e73" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M2,0 L2,6 L11,3 z" fill="#aa4d2b" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M2,0 L2,6 L11,3 z" fill="#63715e" />
    </marker>
  </defs>
  
  <!-- Kernel Module Box -->
  <rect x="310" y="225" width="180" height="110" fill="#fffdf8" stroke="#aa4d2b" stroke-width="2" rx="2"/>
  <text x="400" y="245" font-family="Avenir Next, Avenir, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#29231f" text-anchor="middle">Kernel Module (C)</text>
  <text x="400" y="262" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#aa4d2b" text-anchor="middle">(regex_set.ko)</text>
  <line x1="320" y1="272" x2="480" y2="272" stroke="#d9cdbb" stroke-width="1"/>
  <text x="325" y="295" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5d5148">• Registers kfunc</text>
  <text x="325" y="315" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5d5148">• Allocator (kmalloc)</text>
  
  <!-- Arrow between Kernel Module and Rust Library -->
  <text x="515" y="270" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#aa4d2b" text-anchor="middle">calls</text>
  <path d="M 500 280 L 540 280" stroke="#aa4d2b" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M 540 310 L 500 310" stroke="#63715e" stroke-width="2" marker-end="url(#arrowRed)"/>
  
  <!-- Rust Regex Library Box -->
  <rect x="550" y="225" width="180" height="130" fill="url(#rustGrad)" stroke="#63715e" stroke-width="2" rx="2"/>
  <text x="640" y="245" font-family="Avenir Next, Avenir, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#29231f" text-anchor="middle">Rust Regex Library</text>
  <text x="640" y="262" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#63715e" text-anchor="middle">(libregex_c.a)</text>
  <line x1="560" y1="272" x2="720" y2="272" stroke="#d9cdbb" stroke-width="1"/>
  <text x="565" y="295" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5d5148">• RegexSet (no_std)</text>
  <text x="565" y="315" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#5d5148">• FFI / C API</text>
  <text x="565" y="335" font-family="Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#63715e">• SIMD enabled</text>
  </g>
</svg>
