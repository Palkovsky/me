<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">eBPF policy enforcement with Rust, kfuncs, and regexes</title>
  <desc id="desc">A user process above an eBPF probe, a C kernel module, and a Rust regex library in kernel space, drawn in the site's web-safe style.</desc>

