<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- User Space -->
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ebpfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffebee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcdd2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- User Space Container -->
  <rect x="50" y="30" width="700" height="100" fill="url(#userGrad)" stroke="#78909c" stroke-width="2" rx="10"/>
  <text x="70" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#37474f">User Space</text>
  
  <!-- User Process Box -->
  <rect x="275" y="55" width="250" height="50" fill="#fff" stroke="#546e7a" stroke-width="2" rx="8"/>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="14" fill="#263238" text-anchor="middle">User Process (e.g. bash)</text>
  
  <!-- Kernel Space Container -->
  <rect x="50" y="180" width="700" height="200" fill="url(#kernelGrad)" stroke="#ff8f00" stroke-width="2" rx="10"/>
  <text x="640" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e65100">Kernel Space</text>

  <!-- S-shaped Arrow from User Process to eBPF -->
  <path d="M 400 115 L 400 145 Q 400 155, 390 155 L 160 155 Q 150 155, 150 165 L 150 215" 
        fill="none" stroke="#546e7a" stroke-width="2"/>
  <polygon points="400,110 395,120 405,120" fill="#546e7a"/>
  <polygon points="150,220 145,210 155,210" fill="#546e7a"/>
  <text x="270" y="150" font-family="Arial, sans-serif" font-size="12" fill="#546e7a"> </text>
  
  <!-- eBPF Program Box -->
  <rect x="70" y="225" width="180" height="130" fill="url(#ebpfGrad)" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="160" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">eBPF AMSI</text>
  <text x="160" y="265" font-family="Arial, sans-serif" font-size="11" fill="#33691e" text-anchor="middle">LSM Probe / kprobe</text>
  <line x1="80" y1="275" x2="240" y2="275" stroke="#66bb6a" stroke-width="1"/>
  <text x="85" y="295" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">• Collects cmdline</text>
  <text x="85" y="315" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">• Calls kfunc</text>
  <text x="85" y="335" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">• Enforces decision</text>
  
  <!-- Arrow between eBPF and Kernel Module -->
  <text x="275" y="260" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle">kfunc</text>
  <path d="M 260 270 L 300 270" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 300 300 L 260 300" stroke="#f57c00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M2,0 L2,6 L11,3 z" fill="#2e7d32" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M2,0 L2,6 11,3 z" fill="#f57c00" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M2,0 L2,6 L11,3 z" fill="#c62828" />
    </marker>
  </defs>
  
  <!-- Kernel Module Box -->
  <rect x="310" y="225" width="180" height="110" fill="#fff8e1" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="400" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100" text-anchor="middle">Kernel Module (C)</text>
  <text x="400" y="262" font-family="Arial, sans-serif" font-size="10" fill="#c62828" text-anchor="middle">(regex_set.ko)</text>
  <line x1="320" y1="272" x2="480" y2="272" stroke="#ffb74d" stroke-width="1"/>
  <text x="325" y="295" font-family="Arial, sans-serif" font-size="10" fill="#bf360c">• Registers kfunc</text>
  <text x="325" y="315" font-family="Arial, sans-serif" font-size="10" fill="#bf360c">• Allocator (kmalloc)</text>
  
  <!-- Arrow between Kernel Module and Rust Library -->
  <text x="515" y="270" font-family="Arial, sans-serif" font-size="11" fill="#f57c00" text-anchor="middle">calls</text>
  <path d="M 500 280 L 540 280" stroke="#f57c00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M 540 310 L 500 310" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)"/>
  
  <!-- Rust Regex Library Box -->
  <rect x="550" y="225" width="180" height="130" fill="url(#rustGrad)" stroke="#c62828" stroke-width="2" rx="8"/>
  <text x="640" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b71c1c" text-anchor="middle">Rust Regex Library</text>
  <text x="640" y="262" font-family="Arial, sans-serif" font-size="10" fill="#c62828" text-anchor="middle">(libregex_c.a)</text>
  <line x1="560" y1="272" x2="720" y2="272" stroke="#ef9a9a" stroke-width="1"/>
  <text x="565" y="295" font-family="Arial, sans-serif" font-size="10" fill="#b71c1c">• RegexSet (no_std)</text>
  <text x="565" y="315" font-family="Arial, sans-serif" font-size="10" fill="#b71c1c">• FFI / C API</text>
  <text x="565" y="335" font-family="Arial, sans-serif" font-size="10" fill="#b71c1c">• SIMD enabled</text>
</svg>