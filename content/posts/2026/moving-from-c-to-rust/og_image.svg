<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Moving ownership from C to Rust without cloning</title>
  <desc id="desc">A C allocation crosses the FFI boundary with its pointer, length, and destructor before becoming a Rust-owned ForeignString, drawn as three code panels in the site's web-safe style.</desc>

  <!-- Steel ground and the table's outer bevel -->
  <rect width="1200" height="630" fill="#336699"/>
  <path fill="#6699cc" d="M24 24H1176l-4 4H28V602l-4 4Z"/><path fill="#000033" d="M1176 24V606H24l4 -4H1172V28Z"/>
  <rect x="28" y="28" width="1144" height="574" fill="#ffffff"/>

  <!-- Banner row: the name embossed in gold, the tagline in sky -->
  <rect x="28" y="28" width="1144" height="88" fill="#000033"/>
  <rect x="28" y="116" width="1144" height="6" fill="#ffcc00"/>
  <text x="78" y="76" fill="#ffff99" font-family="Georgia, Gelasio, serif" font-size="44" font-weight="700" letter-spacing="0.44">Dawid Macek</text><text x="82" y="80" fill="#996600" font-family="Georgia, Gelasio, serif" font-size="44" font-weight="700" letter-spacing="0.44">Dawid Macek</text><text x="80" y="78" fill="#ffcc00" font-family="Georgia, Gelasio, serif" font-size="44" font-weight="700" letter-spacing="0.44">Dawid Macek</text>
  <text x="80" y="102" fill="#99ccff" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" letter-spacing="4.2">SYSTEMS PROGRAMMING</text>

  <!-- Footer row -->
  <rect x="28" y="550" width="1144" height="6" fill="#ffcc00"/>
  <rect x="28" y="556" width="1144" height="46" fill="#000033"/>
  <text x="80" y="585" fill="#99ccff" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16">The allocation and its destructor cross the FFI boundary together</text>
  <text x="1120" y="585" fill="#ffcc00" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="16" text-anchor="end">dawidmacek.com</text>

  <!-- Article header: title, dek, meta -->
  <text x="80" y="190" fill="#000033" font-family="Georgia, Gelasio, serif" font-size="52" font-weight="700">Moving ownership from C to Rust</text>
  <text x="80" y="230" fill="#333333" font-family="Georgia, Gelasio, serif" font-size="26" font-style="italic">Without cloning the allocation</text>
  <text x="80" y="262" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="15"><tspan fill="#666666">Published </tspan><tspan fill="#000000" font-weight="700">July 7, 2026</tspan></text>
  <rect x="80" y="280" width="1040" height="2" fill="#999999"/><rect x="80" y="282" width="1040" height="2" fill="#cccccc"/>

  <!-- C -->
  <rect x="80" y="304" width="318" height="224" fill="#cccccc"/><path fill="#ffffff" d="M80 304H398l-3 3H83V525l-3 3Z"/><path fill="#666666" d="M398 304V528H80l3 -3H395V307Z"/><text x="95" y="332" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.84">C</text><rect x="87" y="347" width="304" height="174" fill="#ffffff"/><path fill="#666666" d="M87 347H391l-2 2H89V519l-2 2Z"/><path fill="#ffffff" d="M391 347V521H87l2 -2H389V349Z"/>
  <text x="103" y="387" fill="#003366" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="19" font-weight="700">C buffer</text>
  <rect x="103" y="403" width="272" height="2" fill="#999999"/><rect x="103" y="405" width="272" height="2" fill="#cccccc"/>
  <text x="103" y="447" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#0000ff">char</tspan><tspan fill="#000000"> *buf = malloc(</tspan><tspan fill="#993300">128</tspan><tspan fill="#000000">);</tspan></text>
  <text x="103" y="473" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="15" xml:space="preserve"><tspan fill="#000000">strcpy(buf, </tspan><tspan fill="#990000">"hello from C"</tspan><tspan fill="#000000">);</tspan></text>

  <!-- Handoff -->
  <rect x="454" y="304" width="330" height="224" fill="#cccccc"/><path fill="#ffffff" d="M454 304H784l-3 3H457V525l-3 3Z"/><path fill="#666666" d="M784 304V528H454l3 -3H781V307Z"/><text x="469" y="332" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.84">HANDOFF</text><rect x="461" y="347" width="316" height="174" fill="#ffffff"/><path fill="#666666" d="M461 347H777l-2 2H463V519l-2 2Z"/><path fill="#ffffff" d="M777 347V521H461l2 -2H775V349Z"/>
  <text x="477" y="387" fill="#003366" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="19" font-weight="700">move()</text>
  <rect x="477" y="403" width="284" height="2" fill="#999999"/><rect x="477" y="405" width="284" height="2" fill="#cccccc"/>
  <text x="477" y="447" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="17" xml:space="preserve"><tspan fill="#000000">move(buf, </tspan><tspan fill="#993300">12</tspan><tspan fill="#000000">, free);</tspan></text>
  <rect x="463" y="455" width="312" height="28" fill="#ffff99"/>
  <text x="477" y="475" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="17" xml:space="preserve"><tspan fill="#000000">buf = </tspan><tspan fill="#006666">NULL</tspan><tspan fill="#000000">;</tspan></text>

  <!-- Rust -->
  <rect x="840" y="304" width="280" height="224" fill="#cccccc"/><path fill="#ffffff" d="M840 304H1120l-3 3H843V525l-3 3Z"/><path fill="#666666" d="M1120 304V528H840l3 -3H1117V307Z"/><text x="855" y="332" fill="#000000" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.84">RUST</text><rect x="847" y="347" width="266" height="174" fill="#ffffff"/><path fill="#666666" d="M847 347H1113l-2 2H849V519l-2 2Z"/><path fill="#ffffff" d="M1113 347V521H847l2 -2H1111V349Z"/>
  <text x="863" y="387" fill="#003366" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="19" font-weight="700">Rust-owned string</text>
  <rect x="863" y="403" width="234" height="2" fill="#999999"/><rect x="863" y="405" width="234" height="2" fill="#cccccc"/>
  <text x="863" y="449" font-family="'Lucida Console', Monaco, 'Courier New', monospace" font-size="22" xml:space="preserve"><tspan fill="#006666">ForeignString</tspan></text>
  <text x="863" y="477" fill="#333333" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700">owns buf</text>

  <!-- Flow -->
  <rect x="408" y="432.5" width="21" height="3" fill="#003366"/><polygon points="444,434 428,425 428,443" fill="#003366"/><rect x="794" y="432.5" width="21" height="3" fill="#003366"/><polygon points="830,434 814,425 814,443" fill="#003366"/>
</svg>
