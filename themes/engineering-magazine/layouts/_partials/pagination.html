{{- $paginator := .Paginator -}}
{{- if gt $paginator.TotalPages 1 -}}
  <nav class="pagination" aria-label="Pagination">
    <div>
      {{ with $paginator.Prev }}<a href="{{ .URL }}">← Newer</a>{{ else }}<span></span>{{ end }}
      <span>Page {{ $paginator.PageNumber }} of {{ $paginator.TotalPages }}</span>
      {{ with $paginator.Next }}<a href="{{ .URL }}">Older →</a>{{ else }}<span></span>{{ end }}
    </div>
  </nav>
{{- end -}}
