{{ define "main" }}
  <header class="archive-hero archive-hero--compact">
    <div class="layout-shell archive-hero__grid">
      <div>
        <p class="eyebrow"><span>Index</span> Browse the publication</p>
        <h1>{{ .Title }}</h1>
      </div>
      <p>Explore articles by the technologies, techniques, and systems they investigate.</p>
    </div>
  </header>
  <section class="topic-index">
    <div class="layout-shell topic-index__grid">
      {{ range .Data.Terms.ByCount }}
        <a class="topic-index__item" href="{{ .Page.RelPermalink }}">
          <span>{{ .Page.LinkTitle }}</span>
          <strong>{{ .Count }}</strong>
          <small>{{ if eq .Count 1 }}article{{ else }}articles{{ end }}</small>
        </a>
      {{ end }}
    </div>
  </section>
{{ end }}
