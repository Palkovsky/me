{{- $page := .page -}}
<article class="note-row">
  <div class="note-row__body">
    <div class="note-row__meta">
      <time datetime="{{ $page.Date.Format "2006-01-02" }}">{{ $page.Date.Format "January 2, 2006" }}</time>
      <span>{{ $page.ReadingTime }} min read</span>
    </div>
    <h3><a href="{{ $page.RelPermalink }}">{{ $page.Title }}</a></h3>
    <div class="note-row__summary">{{ $page.Summary }}</div>
    <footer class="note-row__footer">
      {{ partial "topic-list.html" (dict "page" $page "limit" 4) }}
    </footer>
  </div>
</article>
